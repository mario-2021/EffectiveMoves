
<img [src]="effectiveMovies" loading="lazy" class="backgroundImg" alt="Effective Movies">
<div class="container-fluid" style="margin-top: 50px;margin-bottom: 50px;">
  <div class="row">
    <div class="col-12 col-sm-6 col-md-6 col-lg-3 gallery" *ngFor="let item of db">
      <div class="card text-bg-dark images-box">
        <img [src]="item.image" class="card-img" alt="{{ item.name }}"
        loading="lazy" (click)="openPopup(item)">
        <div class="mt-3 mb-3">
          <p class="fs-5 fw-bold">{{ item.title }}</p>
          <button class="buttonMovName" type="button" (click)="openPopup(item)">
            <h5 class="fs-5 fw-bold m-0">
              {{ item.name }}
            </h5>
            <h5 class="fs-5 fw-bold mt-3 mb-0">
              {{ item.session }}
            </h5>
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Overlay -->
  <div class="popup-overlay" *ngIf="selectedImage" (click)="closePopup()"></div>
  <!-- Popup -->
  <div class="popup-box text-center" *ngIf="selectedImage">
    <span class="close-button" (click)="closePopup()">×</span>
    <div class="d-grid gap-2"></div>
    <img [src]="selectedImage.image" alt="" class="popup-img"/>
    <button class="btn btn-primary" type="button" (click)="openPage(selectedImage)">
      <h3 class="popup_name">{{ selectedImage.name }} {{ selectedImage.date }}</h3>
    </button>
  </div>
</div>
