<div class="contact-container">
  <h1>Contact Me</h1>

  <p class="subtitle">
    Feel free to reach out for projects, collaborations, or just a friendly hello 👋
  </p>

  <form (ngSubmit)="submitForm(contactForm)" #contactForm="ngForm">

    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" [(ngModel)]="formData.name" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="formData.email" required />
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea name="message" rows="5" [(ngModel)]="formData.message" required></textarea>
    </div>

    <button type="submit" [disabled]="contactForm.invalid">
      Send Message 🚀
    </button>

  </form>
</div>
